name: Carlyze
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # set your Team ID
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Carlyze:
    type: application
    platform: iOS
    sources:
      - path: Carlyze
        excludes: ["Resources/Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.carlyze
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Carlyze/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
